services:
  backend_service:
    image: custom_backend
    build:
      context: .
      dockerfile: ./infra/service/Dockerfile
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app
      - MONGODB_HOST=mongodb
    depends_on:
      - mongodb
      - minio
    networks:
      - backend_network

  mongodb:
    image: custom_mongodb
    build:
      context: ./infra/mongodb
      dockerfile: Dockerfile
    container_name: mongodb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend_network

  minio:
    image: custom_minio
    build:
      context: ./infra/minio
      dockerfile: Dockerfile
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./infra/minio/product:/home/image   # host image folder → container
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend_network

  frontend:
    image: custom_frontend
    build:
      context: .
      dockerfile: ./infra/frontend/Dockerfile
    container_name: frontend
    ports:
      - "8000:80"
    depends_on:
      - backend_service
      - minio
      - mongodb
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge