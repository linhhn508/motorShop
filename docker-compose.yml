services:
  backend_service:
    image: custom_backend
    build:
      context: .
      dockerfile: ./infra/service/Dockerfile
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app
      - MONGODB_HOST=mongodb
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy

    networks:
      - backend_network

  mongodb:
    image: custom_mongodb
    build:
      context: ./infra/mongodb
      dockerfile: Dockerfile
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - backend_network

  minio:
    image: custom_minio
    build:
      context: ./infra/minio
      dockerfile: Dockerfile
    container_name: minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./infra/minio/product:/home/image   # host image folder → container
    healthcheck:
      # Dont' need mc alias set, just use the local host and port with the credentials
      # If image uploaded successfully, mc ls local/product-image will return the list of images in the bucket -> exit 0, otherwise exit 1
      test: ["CMD-SHELL", "MC_HOST_local=http://$MINIO_ROOT_USER:$MINIO_ROOT_PASSWORD@localhost:9000 mc ls local/product-image"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend_network

  frontend:
    image: custom_frontend
    build:
      context: .
      dockerfile: ./infra/frontend/Dockerfile
    container_name: frontend
    ports:
      - "8000:80"
    depends_on:
      mongodb:
          condition: service_healthy
      minio:
          condition: service_healthy
      backend_service:
          condition: service_started
    networks:
      - backend_network

networks:
  backend_network:
    driver: bridge