services:
  backend_service:
    image: backend:latest
    build:
      context: .
      dockerfile: ./image/service/Dockerfile
    container_name: backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app
      - MONGODB_HOST=mongodb
    depends_on:
      - mongodb
    networks:
      - backend_network

  mongodb:
    image: mongodb:latest
    build: 
      context: .
      dockerfile: ./image/mongodb/Dockerfile
    container_name: mongodb
    networks:
      - backend_network

  minio:
    build:
      context: .
      dockerfile: ./image/minio/Dockerfile
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
      - ../frontend/image/product:/home/image   # host image folder → container
    networks:
      - backend_network


volumes:
  minio_data:

networks:
  backend_network:
    driver: bridge